<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="keywords" content="murugesan,financial life management,india savings account awareness">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil and Gregorian Calendar</title>
    <style>
        body {
            background-color: #004C8F;
            color: #FFFFFF;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        
        .controls {
            margin-bottom: 15px;
        }

        select {
            font-weight: bold;
            padding: 6px 12px;
            font-size: 1rem;
            border-radius: 4px;
        }

        .calendar-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
        }

        .calendar-box {
            flex: 1;
            min-width: 320px;
            background-color: #003D82;
            padding: 10px;
            border-radius: 6px;
            border: 2px solid #0066CC;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        caption {
            font-weight: bold;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #0066CC;
            color: #FFFFFF;
            border-radius: 4px;
        }

        th, td {
            border: 1px solid #0066CC;
            padding: 8px 4px;
            font-size: 0.85rem;
        }

        th {
            background-color: #004C8F;
            color: #FFCC00;
        }

        td {
            background-color: #002B5C;
        }

        .today {
            background-color: #00ff00 !important;
            color: #000000 !important;
            font-weight: bold;
        }

        .new-year {
            background-color: #00ffff !important;
            color: #000000 !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="controls">
        <select id="monthSelector"></select>
    </div>

    <div class="calendar-container">
        <!-- Tamil Calendar -->
        <div class="calendar-box">
            <table id="tamil-calendar">
                <caption>தமிழ் ஆண்டு / Tamil Calendar</caption>
                <thead>
                    <tr>
                        <th>ஞாயிறு</th><th>திங்கள்</th><th>செவ்வாய்</th><th>புதன்</th>
                        <th>வியாழன்</th><th>வெள்ளி</th><th>சனி</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Gregorian Calendar -->
        <div class="calendar-box">
            <table id="gregorian-calendar">
                <caption>Gregorian Calendar</caption>
                <thead>
                    <tr>
                        <th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th>
                        <th>Thu</th><th>Fri</th><th>Sat</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script type="text/javascript">
        // Dynamic Current Date Init
        const today = new Date();
        const initialYear = today.getFullYear(); 
        const initialMonth = today.getMonth();   

        // Accurate Tamil Month Transition Start Dates
        const tamilStarts = [
            { month: 3, day: 14, name: "சித்திரை" },  // Apr 14
            { month: 4, day: 15, name: "வைகாசி" },    // May 15
            { month: 5, day: 15, name: "ஆனி" },      // Jun 15
            { month: 6, day: 17, name: "ஆடி" },      // Jul 17 (Aadi 1 = July 17)
            { month: 7, day: 18, name: "ஆவணி" },     // Aug 18
            { month: 8, day: 18, name: "புரட்டாசி" }, // Sep 18
            { month: 9, day: 18, name: "ஐப்பசி" },   // Oct 18
            { month: 10, day: 17, name: "கார்த்திகை" },// Nov 17
            { month: 11, day: 16, name: "மார்கழி" },  // Dec 16
            { month: 0, day: 15, name: "தை" },       // Jan 15
            { month: 1, day: 13, name: "மாசி" },     // Feb 13
            { month: 2, day: 15, name: "பங்குனி" }   // Mar 15
        ];

        function getTamilDetails(date) {
            const yr = date.getFullYear();
            let startYear = yr;

            if (date < new Date(yr, 3, 14)) startYear--;

            let currentStart = new Date(startYear, 3, 14);
            let currentMonth = "சித்திரை";

            for (let i = 0; i < tamilStarts.length; i++) {
                let s = tamilStarts[i];
                let y = startYear;
                if (s.month < 3) y++;

                let sd = new Date(y, s.month, s.day);
                if (date >= sd) {
                    currentStart = sd;
                    currentMonth = s.name;
                }
            }

            // Calculation for Tamil Day
            const tamilDay = Math.floor((date - currentStart) / (24 * 60 * 60 * 1000)) + 1;
            
            // Thiruvalluvar Aandu (Gregorian Year + 31)
            const thiruvalluvarYear = yr + 31;

            return { month: currentMonth, day: tamilDay, year: thiruvalluvarYear };
        }

        function clearCalendar(tableId) {
            document.getElementById(tableId).getElementsByTagName('tbody')[0].innerHTML = "";
        }

        function populateMonthSelector() {
            const selector = document.getElementById("monthSelector");
            selector.innerHTML = "";
            const monthsBefore = 6;
            const monthsAfter = 12;

            for (let i = -monthsBefore; i <= monthsAfter; i++) {
                const date = new Date(initialYear, initialMonth + i, 1);
                const monthName = date.toLocaleString('default', { month: 'short' });
                const option = document.createElement("option");
                option.value = `${date.getFullYear()}-${date.getMonth()}`;
                option.text = `${monthName}-${date.getFullYear()}`;
                
                // Select active month by default
                if (date.getFullYear() === initialYear && date.getMonth() === initialMonth) {
                    option.selected = true;
                }
                selector.appendChild(option);
            }
        }

        function onMonthChange() {
            const value = document.getElementById("monthSelector").value;
            const [y, m] = value.split("-").map(Number);

            clearCalendar("gregorian-calendar");
            clearCalendar("tamil-calendar");

            createGregorianCalendar(y, m);
            createTamilCalendar(y, m);
        }

        function createGregorianCalendar(year, month) {
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const table = document.getElementById('gregorian-calendar').getElementsByTagName('tbody')[0];

            let row = document.createElement('tr');
            for (let i = 0; i < firstDay; i++) row.appendChild(document.createElement('td'));

            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('td');
                const MMM = new Date(year, month).toLocaleString('default', { month: 'short' });
                cell.textContent = `${day < 10 ? "0" : ""}${day}-${MMM}-${year}`;

                if (today.getDate() === day && today.getMonth() === month && today.getFullYear() === year) {
                    cell.classList.add('today');
                }

                row.appendChild(cell);

                if ((firstDay + day) % 7 === 0) {
                    table.appendChild(row);
                    row = document.createElement('tr');
                }
            }

            while (row.children.length > 0 && row.children.length < 7) {
                row.appendChild(document.createElement('td'));
            }
            if (row.children.length > 0) table.appendChild(row);
        }

        function createTamilCalendar(year, month) {
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const table = document.getElementById('tamil-calendar').getElementsByTagName('tbody')[0];

            let row = document.createElement('tr');
            let tamilNewYearMarked = false;

            for (let i = 0; i < firstDay; i++) row.appendChild(document.createElement('td'));

            for (let day = 1; day <= daysInMonth; day++) {
                const d = new Date(year, month, day);
                const tamil = getTamilDetails(d);
                const cell = document.createElement('td');
                
                cell.textContent = `${tamil.day < 10 ? "0" : ""}${tamil.day}-${tamil.month}-${tamil.year}`;

                // Highlight today
                if (today.getDate() === day && today.getMonth() === month && today.getFullYear() === year) {
                    cell.classList.add('today');
                }

                // Highlight Chithirai 1 (Tamil New Year)
                if (!tamilNewYearMarked && tamil.month === "சித்திரை" && tamil.day === 1) {
                    cell.classList.add('new-year');
                    cell.title = "புத்தாண்டு வாழ்த்துக்கள்";
                    tamilNewYearMarked = true;
                }

                row.appendChild(cell);

                if ((firstDay + day) % 7 === 0) {
                    table.appendChild(row);
                    row = document.createElement('tr');
                }
            }

            while (row.children.length > 0 && row.children.length < 7) {
                row.appendChild(document.createElement('td'));
            }
            if (row.children.length > 0) table.appendChild(row);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const selector = document.getElementById("monthSelector");
            populateMonthSelector();
            selector.addEventListener("change", onMonthChange);
            onMonthChange();

            // Keyboard navigation
            document.addEventListener('keydown', (event) => {
                const options = selector.options;
                const currentIndex = selector.selectedIndex;

                if (options.length > 0) {
                    if (event.key === 'ArrowDown' && currentIndex < options.length - 1) {
                        selector.selectedIndex = currentIndex + 1;
                        onMonthChange();
                    } else if (event.key === 'ArrowUp' && currentIndex > 0) {
                        selector.selectedIndex = currentIndex - 1;
                        onMonthChange();
                    }
                }
            });
        });
    </script>
</body>
</html>
